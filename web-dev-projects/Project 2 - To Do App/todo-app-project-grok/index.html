<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="app">
    <header>
      <h1><i class="fas fa-check-circle"></i> My To-Do List</h1>
      <button id="themeToggle" class="theme-btn" title="Toggle Dark Mode">
        <i class="fas fa-moon"></i>
      </button>
    </header>

    <div class="todo-container">
      <!-- Input Section -->
      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter a new task..." autocomplete="off">
        <button id="addBtn"><i class="fas fa-plus"></i> Add Task</button>
      </div>

      <!-- Search -->
      <div class="search-section">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search tasks...">
      </div>

      <!-- Filters -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- Stats -->
      <div class="stats">
        <span id="totalTasks">0 tasks</span>
        <span id="completedCount">0 completed</span>
        <span id="pendingCount">0 pending</span>
      </div>

      <!-- Task List -->
      <ul id="taskList"></ul>

      <!-- Actions -->
      <div class="actions">
        <button id="clearCompleted" class="action-btn"><i class="fas fa-broom"></i> Clear Completed</button>
        <button id="deleteAll" class="action-btn danger"><i class="fas fa-trash"></i> Delete All</button>
      </div>
    </div>

    <footer>
      <p>Built with HTML, CSS & JavaScript • Data saved in Local Storage</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
