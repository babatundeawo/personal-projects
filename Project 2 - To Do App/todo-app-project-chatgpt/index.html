<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive JavaScript To-Do List application with search, filters, editing and local storage.">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="appTitle">
      <header class="app-header">
        <div>
          <p class="eyebrow">Task Manager</p>
          <h1 id="appTitle">My To-Do List</h1>
          <p class="subtitle">Organize your day, one task at a time.</p>
        </div>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
      </header>

      <form id="todoForm" class="todo-form">
        <label class="sr-only" for="taskInput">Enter a new task</label>
        <input id="taskInput" type="text" maxlength="120" placeholder="Enter a new task..." autocomplete="off">
        <button id="addBtn" class="primary-btn" type="submit">Add Task</button>
      </form>

      <div class="toolbar">
        <label class="search-box" for="searchInput">
          <span aria-hidden="true">🔍</span>
          <input id="searchInput" type="search" placeholder="Search tasks..." autocomplete="off">
        </label>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>
      </div>

      <div class="stats" aria-live="polite">
        <span><strong id="totalCount">0</strong> total</span>
        <span><strong id="activeCount">0</strong> active</span>
        <span><strong id="completedCount">0</strong> completed</span>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📝</div>
        <h2>No tasks yet</h2>
        <p>Add your first task above to get started.</p>
      </div>

      <footer class="app-footer">
        <button id="clearCompletedBtn" class="text-btn" type="button">Clear completed</button>
        <button id="deleteAllBtn" class="danger-btn" type="button">Delete all</button>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
