<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <header>
      <h1>Task Manager</h1>
      <div class="stats">
        <span id="activeCount">0 active</span> • <span id="completedCount">0 completed</span>
      </div>
    </header>

    <!-- Input Section -->
    <form id="taskForm" class="input-group">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
      <button type="submit" id="addBtn">Add Task</button>
    </form>

    <!-- Controls: Search & Filters -->
    <div class="controls">
      <input type="text" id="search" placeholder="🔍 Search tasks...">
      <div class="filter-buttons">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Action Bar -->
    <footer class="action-bar">
      <button type="button" id="clearCompletedBtn" class="secondary-btn">Clear Completed</button>
      <button type="button" id="deleteAllBtn" class="danger-btn">Delete All</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
