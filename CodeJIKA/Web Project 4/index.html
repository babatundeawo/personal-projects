<canvas id="game" width="400" height="400"></canvas>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let tileCount = 20;
  let tileSize = canvas.width / tileCount - 2;
  let headX = 10;
  let headY = 10;
  let appleX = 5;
  let appleY = 5;
  const snakeParts = [];
  let tailLength = 2;

  class SnakePart {
    constructor(x, y) {
      this.x = x;
      this.y = y;
    }
  }

  let xVelocity = 0;
  let yVelocity = 0;

  function drawGame() {
    clearScreen();
    changeSnakePosition();
    let collision = checkAppleCollision(); // Fix: renamed checkAppCollision to checkAppleCollision
    if (collision) {
      placeApple();
    }
    checkWall();
    drawScore();
    drawSnake();
    drawApple();
    setTimeout(drawGame, 1000 / 7);
  }

  function clearScreen() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawSnake() {
    ctx.fillStyle = "orange";
    ctx.fillRect(headX * tileSize, headY * tileSize, tileSize, tileSize); // Fix: tileSize is used instead of tileCount to calculate dimensions

    ctx.fillStyle = "green";
    for (let i = 0; i < snakeParts.length; i++) {
      let part = snakeParts[i];
      ctx.fillRect(part.x * tileSize, part.y * tileSize, tileSize, tileSize); // Fix: tileSize instead of tileCount
    }

    snakeParts.push(new SnakePart(headX, headY));
    while (snakeParts.length > tailLength) {
      snakeParts.shift();
    }
  }

  function changeSnakePosition() {
    headX += xVelocity;
    headY += yVelocity;
  }

  function drawApple() {
    ctx.fillStyle = "red";
    ctx.fillRect(appleX * tileSize, appleY * tileSize, tileSize, tileSize); // Fix: tileSize for proper apple size
  }

  function checkAppleCollision() {
    // Fix: renamed function for consistency
    if (appleX === headX && appleY === headY) {
      tailLength++;
      return true; // Return true to indicate collision
    }
    return false;
  }

  function placeApple() {
    // Fix: new function to re-position apple when eaten
    appleX = Math.floor(Math.random() * tileCount);
    appleY = Math.floor(Math.random() * tileCount);
  }

  function checkWall() {
    if (headY < 0) headY = tileCount - 1;
    if (headY >= tileCount) headY = 0;
    if (headX < 0) headX = tileCount - 1;
    if (headX >= tileCount) headX = 0;
  }

  function drawScore() {
    ctx.fillStyle = "white";
    ctx.font = "20px Verdana";
    ctx.fillText("Score " + (tailLength - 2), canvas.width - 100, 40);
  }

  document.body.addEventListener("keydown", keyDown);

  function keyDown(event) {
    if (event.keyCode == 38 && yVelocity !== 1) {
      // Up arrow
      yVelocity = -1;
      xVelocity = 0;
    }
    if (event.keyCode == 40 && yVelocity !== -1) {
      // Down arrow
      yVelocity = 1;
      xVelocity = 0;
    }
    if (event.keyCode == 37 && xVelocity !== 1) {
      // Left arrow
      yVelocity = 0;
      xVelocity = -1;
    }
    if (event.keyCode == 39 && xVelocity !== -1) {
      // Right arrow
      yVelocity = 0;
      xVelocity = 1;
    }
  }

  drawGame();
</script>
