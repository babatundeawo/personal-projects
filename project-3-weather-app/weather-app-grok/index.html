<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="app">
    <header>
      <h1><i class="fas fa-cloud-sun"></i> Weather App</h1>
      <div class="header-actions">
        <button id="unitToggle" class="icon-btn" title="Toggle °C / °F">°C</button>
        <button id="themeToggle" class="icon-btn" title="Toggle Dark Mode">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div class="search-box">
      <div class="search-input-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
        <button id="locationBtn" class="icon-btn" title="Use my location">
          <i class="fas fa-location-crosshairs"></i>
        </button>
      </div>
      <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
    </div>

    <!-- Recent Searches -->
    <div id="recentSearches" class="recent-searches"></div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Fetching weather...</p>
    </div>

    <!-- Error -->
    <div id="error" class="error hidden">
      <i class="fas fa-exclamation-circle"></i>
      <p id="errorMsg">City not found</p>
    </div>

    <!-- Current Weather -->
    <div id="weatherCard" class="weather-card hidden">
      <div class="current-header">
        <div>
          <h2 id="cityName">—</h2>
          <p id="localDateTime" class="datetime">—</p>
        </div>
        <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon">
      </div>

      <div class="temp-section">
        <span id="temperature" class="temp">—</span>
        <p id="description" class="desc">—</p>
        <p id="feelsLike" class="feels">Feels like —</p>
      </div>

      <div class="details-grid">
        <div class="detail-item">
          <i class="fas fa-droplet"></i>
          <div>
            <span class="label">Humidity</span>
            <span id="humidity" class="value">—</span>
          </div>
        </div>
        <div class="detail-item">
          <i class="fas fa-wind"></i>
          <div>
            <span class="label">Wind</span>
            <span id="wind" class="value">—</span>
          </div>
        </div>
        <div class="detail-item">
          <i class="fas fa-eye"></i>
          <div>
            <span class="label">Visibility</span>
            <span id="visibility" class="value">—</span>
          </div>
        </div>
        <div class="detail-item">
          <i class="fas fa-gauge-high"></i>
          <div>
            <span class="label">Pressure</span>
            <span id="pressure" class="value">—</span>
          </div>
        </div>
        <div class="detail-item">
          <i class="fas fa-sun"></i>
          <div>
            <span class="label">Sunrise</span>
            <span id="sunrise" class="value">—</span>
          </div>
        </div>
        <div class="detail-item">
          <i class="fas fa-moon"></i>
          <div>
            <span class="label">Sunset</span>
            <span id="sunset" class="value">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 5-Day Forecast -->
    <div id="forecastSection" class="forecast-section hidden">
      <h3><i class="fas fa-calendar-days"></i> 5-Day Forecast</h3>
      <div id="forecast" class="forecast-grid"></div>
    </div>

    <footer>
      <p>Powered by OpenWeatherMap • Data updates in real time</p>
      <p class="note">Add your free API key in <code>script.js</code> to enable the app</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
