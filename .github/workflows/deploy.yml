# Builds, checks and publishes the site to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job asks for more below.
permissions:
  contents: read

# Never run two deployments at once, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and check the site
        uses: ./.github/actions/build-site

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Check the live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the live site answers correctly
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # Pages can take a few seconds to start serving the new version, so retry.
          fetch() { curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "$1"; }
          fetch "${URL}" | grep -q "Build Log" || { echo "::error::The home page did not load or looks wrong."; exit 1; }
          fetch "${URL}site.webmanifest" | grep -q '"standalone"' || { echo "::error::The app manifest is missing."; exit 1; }
          fetch "${URL}sw.js" | grep -q "ba-shell-" || { echo "::error::The offline service worker is missing."; exit 1; }
          fetch "${URL}offline.html" > /dev/null || { echo "::error::The offline page is missing."; exit 1; }
          echo "Live site verified: ${URL}"
